
name: SkyBook ECR Push Test

on:
  workflow_dispatch:

jobs:
  ecr-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build test image
        run: |
          mkdir ecr-test
          echo 'FROM alpine:3.21' > ecr-test/Dockerfile
          echo 'CMD ["echo", "SkyBook ECR push successful"]' >> ecr-test/Dockerfile
          docker build -t skybook:ecr-test ./ecr-test

      - name: Push test image
        run: |
          docker tag skybook:ecr-test \
            107759015479.dkr.ecr.us-east-1.amazonaws.com/skybook:ecr-test

          docker push \
            107759015479.dkr.ecr.us-east-1.amazonaws.com/skybook:ecr-test
