name: SkyBook CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend Tests and Security
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Check JavaScript syntax
        working-directory: .
        run: |
          find backend/src -type f -name "*.js" -print0 |
          xargs -0 -r -n1 node --check

      - name: Run dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Build backend Docker image
        working-directory: .
        run: docker build -t skybook-backend:${{ github.sha }} ./backend
      - name: Scan filesystem with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: skybook-backend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate Software Bill of Materials
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: skybook-backend:${{ github.sha }}
          format: cyclonedx
          output: skybook-sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: skybook-sbom
          path: skybook-sbom.cdx.json


  secret-scanning:
    name: Gitleaks Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/javascript

  dast-zap:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate DAST secrets
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          test -n "$MYSQL_ROOT_PASSWORD" || { echo "::error::MYSQL_ROOT_PASSWORD is missing"; exit 1; }
          test -n "$DB_PASSWORD" || { echo "::error::DB_PASSWORD is missing"; exit 1; }
          test -n "$JWT_SECRET" || { echo "::error::JWT_SECRET is missing"; exit 1; }
          echo "All required DAST secrets are available."

      - name: Start SkyBook backend
        run: |
          docker compose up -d db mailpit backend
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root-password-${{ github.run_id }}
          DB_PASSWORD: ci-only-db-password-${{ github.run_id }}
          JWT_SECRET: ci-only-jwt-secret-${{ github.run_id }}-not-for-production
      - name: Debug MySQL startup
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs db
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:5000/api/health; then
              exit 0
            fi
            sleep 5
          done
          echo "Backend failed to become healthy"
          docker compose logs backend db
          exit 1

      - name: Run OWASP ZAP baseline scan
        run: |
          mkdir -p zap-reports
          docker run --rm \
            --network host \
            -v "$PWD/zap-reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:5000 \
            -r skybook-zap-report.html \
            -J skybook-zap-report.json

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skybook-zap-reports
          path: zap-reports/
          if-no-files-found: warn

      - name: Stop SkyBook services
        if: always()
        run: docker compose down


  aws-oidc-auth:
    name: AWS OIDC Authentication
    runs-on: ubuntu-latest

    # Only authenticate on pushes to main, not pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity
