name: CodeBuild OIDC and EKS Access Test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  eks-access:
    name: Authenticate and access private EKS
    runs-on:
      - codebuild-skybook-github-runner-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 15

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Install kubectl
        run: |
          curl -fsSLO https://dl.k8s.io/release/v1.37.1/bin/linux/amd64/kubectl
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Configure EKS access
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name skybook-eks

      - name: Verify least-privilege RBAC
        shell: bash
        run: |
          set -euo pipefail

          echo "1. Checking cluster-level node access (expected: no)"
          NODE_ACCESS="$(kubectl auth can-i list nodes || true)"
          echo "Node access: $NODE_ACCESS"

          if [ "$NODE_ACCESS" != "no" ]; then
            echo "ERROR: Expected node access to be denied"
            exit 1
          fi

          echo "2. Checking namespace deployment access (expected: yes)"
          DEPLOYMENT_ACCESS="$(kubectl auth can-i get deployments -n skybook)"
          echo "Deployment access: $DEPLOYMENT_ACCESS"

          if [ "$DEPLOYMENT_ACCESS" != "yes" ]; then
            echo "ERROR: Expected deployment access in skybook"
            exit 1
          fi

          echo "3. Reading SkyBook deployments"
          kubectl get deployments -n skybook

          echo "4. Reading SkyBook services"
          kubectl get services -n skybook

          echo "RBAC validation completed successfully"
