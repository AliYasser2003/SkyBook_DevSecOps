name: SkyBook Deploy

on:
  workflow_run:
    workflows: ["SkyBook CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: skybook-production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "107759015479"
  ECR_REPOSITORY: skybook
  EKS_CLUSTER: skybook-eks
  K8S_NAMESPACE: skybook

jobs:
  build-and-push:
    name: Build, Scan, Sign and Push
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image
        run: |
          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"

          docker build \
            --pull \
            -t "${IMAGE_URI}:${IMAGE_TAG}" \
            -f backend/Dockerfile \
            backend

          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin v0.76.2

      - name: Scan image for vulnerabilities
        run: |
          trivy image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            "${IMAGE_URI}:${IMAGE_TAG}"

      - name: Generate CycloneDX SBOM
        run: |
          trivy image \
            --format cyclonedx \
            --output skybook-backend-sbom.json \
            "${IMAGE_URI}:${IMAGE_TAG}"

      - name: Push image to ECR
        run: |
          docker push "${IMAGE_URI}:${IMAGE_TAG}"

      - name: Install Cosign
        env:
          COSIGN_VERSION: v3.1.4
        run: |
          curl -fsSLo cosign \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"

          sudo install -m 0755 cosign /usr/local/bin/cosign
          cosign version

      - name: Sign image using keyless Cosign
        run: |
          cosign sign --yes "${IMAGE_URI}:${IMAGE_TAG}"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: skybook-backend-sbom-${{ env.IMAGE_TAG }}
          path: skybook-backend-sbom.json
          retention-days: 7

  deploy:
    name: Deploy to Amazon EKS
    needs: build-and-push
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on:
      - codebuild-skybook-github-runner-${{ github.run_id }}-${{ github.run_attempt }}

    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Install kubectl
        run: |
          curl -fsSLo kubectl \
            "https://dl.k8s.io/release/v1.37.1/bin/linux/amd64/kubectl"

          chmod +x kubectl
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Install Helm
        run: |
          curl -fsSLO \
            https://get.helm.sh/helm-v3.20.2-linux-amd64.tar.gz

          tar -xzf helm-v3.20.2-linux-amd64.tar.gz
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
          helm version

      - name: Connect to EKS
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

          kubectl get deployments -n "$K8S_NAMESPACE"

      - name: Validate Helm chart
        run: |
          helm lint helm/skybook-backend

          helm template skybook-backend helm/skybook-backend \
            --namespace "$K8S_NAMESPACE" \
            --set-string image.tag="$IMAGE_TAG" \
            > /tmp/skybook-rendered.yaml

      - name: Deploy backend using Helm
        run: |
          helm upgrade --install skybook-backend helm/skybook-backend \
            --namespace "$K8S_NAMESPACE" \
            --set-string image.tag="$IMAGE_TAG" \
            --wait \
            --timeout 5m

      - name: Verify deployment rollout
        run: |
          kubectl rollout status deployment/skybook-backend \
            -n "$K8S_NAMESPACE" \
            --timeout=300s

          kubectl get pods -n "$K8S_NAMESPACE" -o wide
          kubectl get services -n "$K8S_NAMESPACE"

      - name: Verify backend health endpoint
        run: |
          kubectl port-forward \
            -n "$K8S_NAMESPACE" \
            service/skybook-backend \
            18080:5000 \
            >/tmp/skybook-port-forward.log 2>&1 &

          PF_PID=$!
          trap 'kill "$PF_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:18080/api/health; then
              echo
              echo "Backend health check passed."
              exit 0
            fi

            sleep 2
          done

          cat /tmp/skybook-port-forward.log
          echo "Backend health check failed."
          exit 1
