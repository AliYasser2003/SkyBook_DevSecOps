apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: skybook-backend-egress
  namespace: skybook
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: skybook-backend
  policyTypes:
    - Egress
  egress:
    # Allow DNS queries to CoreDNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Allow MySQL connections inside the SkyBook VPC
    - to:
        - ipBlock:
            cidr: 172.31.0.0/16
      ports:
        - protocol: TCP
          port: 3306

    # Allow HTTPS for SES and external HTTPS integrations
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
