apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: skybook-backend-external-secret
  namespace: skybook
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: skybook-backend-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        JWT_SECRET: "{{ .jwt_secret }}"
        DB_USER: "{{ .db_username }}"
        DB_PASSWORD: "{{ .db_password }}"
        DB_HOST: "skybook-mysql.c8j6q24469tp.us-east-1.rds.amazonaws.com"
        DB_PORT: "3306"
        DB_NAME: "flight_booking"

  data:
    - secretKey: jwt_secret
      remoteRef:
        key: skybook/prod/backend
        property: JWT_SECRET

    - secretKey: db_username
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:107759015479:secret:rds!db-c027b869-00e5-49fa-aff6-a8d847de67e7-IutGz9
        property: username

    - secretKey: db_password
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:107759015479:secret:rds!db-c027b869-00e5-49fa-aff6-a8d847de67e7-IutGz9
        property: password
