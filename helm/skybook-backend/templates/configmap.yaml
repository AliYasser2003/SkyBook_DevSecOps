apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "skybook-backend.fullname" . }}-config
  labels:
    {{- include "skybook-backend.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  EMAIL_PROVIDER: {{ .Values.config.emailProvider | quote }}
  AWS_REGION: {{ .Values.config.awsRegion | quote }}
  SES_FROM_EMAIL: {{ .Values.config.sesFromEmail | quote }}
