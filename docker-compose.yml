name: skybook

services:
  db:
    image: mysql:8.4
    container_name: flight-booking-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: flight_booking
      MYSQL_USER: skybook_app
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [flight-net]

  backend:
    build: ./backend
    container_name: flight-booking-backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      NODE_ENV: development
      PORT: 5000
      FRONTEND_ORIGIN: http://localhost:5173
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: skybook_app
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: flight_booking
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 8h
      COOKIE_SECURE: "false"
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mailpit}
      AWS_REGION: ${AWS_REGION:-}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: "SkyBook <no-reply@skybook.local>"
      APP_BASE_URL: http://localhost:5173
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      db: { condition: service_healthy }
      mailpit: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks: [flight-net]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100

  frontend:
    build: ./frontend
    container_name: flight-booking-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend: { condition: service_healthy }
    networks: [flight-net]

  mailpit:
    image: axllent/mailpit:latest
    container_name: flight-booking-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks: [flight-net]

volumes:
  mysql_data:
networks:
  flight-net:
    driver: bridge
